  <h2>Recording</h2>
  <!--
    Videos are stored in Git LFS. GitHub Pages does not serve LFS content, so
    this points at media.githubusercontent.com, which does. Bandwidth counts
    against the org's LFS quota, hence preload="none" — nothing downloads until
    someone presses play.
  -->
  <video
    controls
    preload="none"
    width="100%"
    poster="assets/thumbnail.png"
    src="https://media.githubusercontent.com/media/emlab-ucsb/ai-study-club/main/assets/file_example_MOV_480_700kB.mov">
