<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Kelvin Wave — a foot of ocean crossing the Pacific</title>
<style>
  :root{
    --surface-1:#fcfcfb; --page:#f9f9f7;
    --text-primary:#0b0b0b; --text-secondary:#52514e; --muted:#898781;
    --grid:#e1e0d9; --axis:#c3c2b7; --border:rgba(11,11,11,0.10);
    --series-1:#2a78d6;  /* blue  — sea level / water */
    --series-2:#eb6834;  /* orange — warm anomaly */
    --series-3:#1baf7a;  /* aqua  — tides */
    --dry:#e34948; --wet:#2a78d6; --neutral:#f0efec; --neutral-ink:#898781;
    --blue-100:#cde2fb; --blue-250:#86b6ef; --blue-450:#2a78d6; --blue-600:#184f95;
    --land:#eceae3; --land-line:#d8d5cb; --ocean:#f4f6f8;
    --wash:rgba(42,120,214,0.10); --warmwash:rgba(235,104,52,0.12);
    color-scheme:light;
  }
  :root[data-theme="dark"]{
    --surface-1:#1a1a19; --page:#0d0d0d;
    --text-primary:#ffffff; --text-secondary:#c3c2b7; --muted:#898781;
    --grid:#2c2c2a; --axis:#383835; --border:rgba(255,255,255,0.10);
    --series-1:#3987e5; --series-2:#d95926; --series-3:#199e70;
    --dry:#e66767; --wet:#3987e5; --neutral:#383835; --neutral-ink:#c3c2b7;
    --blue-100:#184f95; --blue-250:#1c5cab; --blue-450:#3987e5; --blue-600:#9ec5f4;
    --land:#262624; --land-line:#38383a; --ocean:#141416;
    --wash:rgba(57,135,229,0.14); --warmwash:rgba(217,89,38,0.16);
    color-scheme:dark;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--page); color:var(--text-primary);
    font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
    font-size:15px; line-height:1.6; -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1120px;margin:0 auto;padding:28px 20px 80px}
  header.masthead{display:flex;align-items:flex-start;gap:20px;flex-wrap:wrap;
    justify-content:space-between;padding-bottom:22px;border-bottom:1px solid var(--border);margin-bottom:8px}
  .kicker{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--series-2);font-weight:650}
  h1{font-size:clamp(28px,4.4vw,46px);line-height:1.1;margin:.28em 0 .18em;letter-spacing:-.022em;font-weight:680;max-width:17ch}
  .dek{font-size:17px;color:var(--text-secondary);max-width:62ch;margin:0}
  .dateline{font-size:12.5px;color:var(--muted);margin-top:14px}
  button.theme{background:var(--surface-1);color:var(--text-secondary);border:1px solid var(--border);
    border-radius:999px;padding:7px 14px;font:inherit;font-size:13px;cursor:pointer;white-space:nowrap}
  button.theme:hover{color:var(--text-primary)}

  section{margin-top:44px}
  h2{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);
     font-weight:650;margin:0 0 6px;padding-top:6px;border-top:1px solid var(--border)}
  h3{font-size:22px;line-height:1.25;margin:.15em 0 .45em;letter-spacing:-.012em;font-weight:640}
  p{margin:.5em 0 1em;max-width:70ch;color:var(--text-secondary)}
  p strong{color:var(--text-primary);font-weight:620}
  .card{background:var(--surface-1);border:1px solid var(--border);border-radius:14px;padding:22px 22px 18px;margin:18px 0}
  .card > .fig-title{font-size:17px;font-weight:640;color:var(--text-primary);margin:0 0 3px;letter-spacing:-.008em}
  .card > .fig-sub{font-size:13.5px;color:var(--text-secondary);margin:0 0 18px;max-width:78ch}
  .note{font-size:12.5px;color:var(--muted);margin:14px 0 0;max-width:80ch;line-height:1.5}

  /* KPI row */
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(178px,1fr));gap:1px;background:var(--border);
    border:1px solid var(--border);border-radius:14px;overflow:hidden;margin:20px 0}
  .kpi{background:var(--surface-1);padding:17px 18px 15px}
  .kpi .l{font-size:12px;color:var(--muted);letter-spacing:.02em;margin-bottom:5px}
  .kpi .v{font-size:27px;font-weight:660;letter-spacing:-.022em;line-height:1.1;color:var(--text-primary)}
  .kpi .u{font-size:14px;font-weight:500;color:var(--text-secondary);margin-left:2px}
  .kpi .d{font-size:12.5px;color:var(--text-secondary);margin-top:5px;line-height:1.35}

  /* hero */
  .hero{display:flex;gap:26px;align-items:center;flex-wrap:wrap}
  .hero .num{font-size:clamp(54px,9vw,88px);font-weight:670;letter-spacing:-.035em;line-height:.95;color:var(--series-1)}
  .hero .num small{font-size:.34em;font-weight:560;letter-spacing:-.01em;color:var(--text-secondary);margin-left:6px}
  .hero .cap{max-width:38ch;font-size:15px;color:var(--text-secondary)}

  /* legend */
  .legend{display:flex;flex-wrap:wrap;gap:8px 20px;margin:0 0 14px;font-size:13px;color:var(--text-secondary)}
  .legend span.item{display:inline-flex;align-items:center;gap:7px}
  .sw{width:12px;height:12px;border-radius:3px;flex:none}
  .swline{width:18px;height:2px;border-radius:2px;flex:none}
  .swdot{width:11px;height:11px;border-radius:50%;flex:none;box-shadow:0 0 0 2px var(--surface-1)}

  figure{margin:0}
  svg{display:block;width:100%;height:auto;overflow:visible}
  svg.mapsvg{overflow:hidden;border-radius:10px}
  .gridline{stroke:var(--grid);stroke-width:1;shape-rendering:crispEdges}
  .axisline{stroke:var(--axis);stroke-width:1;shape-rendering:crispEdges}
  text{font-family:inherit}
  .tick{font-size:11.5px;fill:var(--muted);font-variant-numeric:tabular-nums}
  .axtitle{font-size:11.5px;fill:var(--muted);letter-spacing:.04em;text-transform:uppercase}
  .dlabel{font-size:12px;fill:var(--text-primary);font-weight:620}
  .dlabel.sec{fill:var(--text-secondary);font-weight:500}
  .anno{font-size:11.5px;fill:var(--text-secondary)}
  .annoK{font-size:11px;fill:var(--muted);letter-spacing:.05em;text-transform:uppercase}

  /* tooltip */
  #tip{position:fixed;z-index:60;pointer-events:none;opacity:0;transition:opacity .09s;
    background:var(--surface-1);border:1px solid var(--border);border-radius:9px;
    box-shadow:0 6px 24px rgba(0,0,0,.14);padding:9px 11px;font-size:12.5px;max-width:280px;color:var(--text-secondary)}
  #tip .th{font-size:12px;color:var(--muted);margin-bottom:5px}
  #tip .tr{display:flex;align-items:baseline;gap:8px;margin-top:3px}
  #tip .tv{font-size:14.5px;font-weight:650;color:var(--text-primary);letter-spacing:-.01em}
  #tip .tk{width:14px;height:2px;border-radius:2px;flex:none;position:relative;top:-4px}
  #tip .tn{color:var(--text-secondary)}
  #tip .tx{margin-top:6px;font-size:12px;color:var(--text-secondary);line-height:1.4}

  details.tbl{margin-top:16px;border-top:1px solid var(--border);padding-top:12px}
  details.tbl summary{font-size:12.5px;color:var(--muted);cursor:pointer;list-style:none;user-select:none}
  details.tbl summary::-webkit-details-marker{display:none}
  details.tbl summary::before{content:"▸ ";color:var(--axis)}
  details.tbl[open] summary::before{content:"▾ "}
  details.tbl summary:hover{color:var(--text-primary)}
  table{border-collapse:collapse;width:100%;margin-top:12px;font-size:13px}
  th,td{text-align:left;padding:7px 12px 7px 0;border-bottom:1px solid var(--grid);vertical-align:top}
  th{font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:600}
  td.n{font-variant-numeric:tabular-nums;text-align:right;padding-right:22px;white-space:nowrap;color:var(--text-primary)}
  td{color:var(--text-secondary)}
  td .mk{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:8px;vertical-align:baseline}

  .two{display:grid;grid-template-columns:1fr 1fr;gap:18px}
  @media (max-width:820px){.two{grid-template-columns:1fr}}
  .toggles{display:flex;gap:8px;margin:0 0 16px;flex-wrap:wrap}
  .toggles button{background:var(--surface-1);border:1px solid var(--border);color:var(--text-secondary);
    border-radius:999px;padding:6px 14px;font:inherit;font-size:13px;cursor:pointer}
  .toggles button[aria-pressed="true"]{background:var(--series-1);border-color:var(--series-1);color:#fff;font-weight:560}
  :root[data-theme="dark"] .toggles button[aria-pressed="true"]{color:#0d0d0d}
  .toggles button:hover{color:var(--text-primary)}
  .toggles button[aria-pressed="true"]:hover{color:#fff}
  :root[data-theme="dark"] .toggles button[aria-pressed="true"]:hover{color:#0d0d0d}

  .sources{font-size:13px;color:var(--text-secondary)}
  .sources ol{padding-left:20px;margin:10px 0}
  .sources li{margin:5px 0}
  a{color:var(--series-1)}
  .land{fill:var(--land);stroke:var(--land-line);stroke-width:.7;stroke-linejoin:round}
  .oceanbg{fill:var(--ocean)}
  .hit{fill:transparent;cursor:pointer}
  .pill{font-size:11px;fill:var(--surface-1);font-weight:650}
</style>
</head>
<body>
<div id="tip" role="status" aria-live="polite"></div>
<div class="wrap">
